<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f3f6f3;color:#20352b;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f3f6f3;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dce5dd;border-radius:16px;">
            <tr>
              <td style="padding:36px 32px;text-align:left;">
                <p style="margin:0 0 12px;color:#2b684f;font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;">RoomScouter</p>
                <h1 style="margin:0 0 16px;color:#173956;font-size:26px;line-height:1.25;">Verify your email address</h1>
                <p style="margin:0 0 24px;color:#526158;font-size:16px;line-height:1.6;">Enter this verification code in RoomScouter to finish creating your account:</p>
                <p style="display:inline-block;margin:0 0 24px;border:1px solid #dce5dd;border-radius:12px;padding:16px 24px;color:#173956;background:#f3f8f4;font-size:32px;font-weight:bold;letter-spacing:8px;">{{ .Token }}</p>
                <p style="margin:0;color:#6c7971;font-size:13px;line-height:1.6;">If you did not create a RoomScouter account, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
